<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔法對決貨幣計算器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="icon.gif" type="image/gif">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    font-size: 14px;
    background: #fff5f8;
    color: #2c2c2a;
    min-height: 100vh;
  }

  .mc-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 1.5rem 1rem 2rem;
  }

  .mc-header { text-align: center; margin-bottom: 1.5rem; }

  .mc-logo-ring {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: #fbeaf0;
    border: 1.5px solid #ed93b1;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 10px;
    font-size: 24px;
  }

  .mc-title {
    font-size: 20px; font-weight: 600;
    color: #993556; letter-spacing: 0.04em; margin-bottom: 3px;
  }

  .mc-subtitle { font-size: 12px; color: #d4537e; }
  .mc-meta { font-size: 11px; color: #888780; margin-top: 2px; }

  .mc-card {
    background: #fff;
    border: 0.5px solid #f4c0d1;
    border-radius: 14px;
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }

  .mc-section-title {
    font-size: 13px; font-weight: 600;
    color: #993556; letter-spacing: 0.06em;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 6px;
  }

  .mc-section-title::before {
    content: '';
    display: inline-block;
    width: 3px; height: 14px;
    background: #d4537e; border-radius: 2px;
  }

  .mc-form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
  }

  .mc-field label {
    display: block; font-size: 12px;
    color: #5f5e5a; margin-bottom: 4px;
  }

  .mc-field input,
  .mc-field select {
    width: 100%; height: 34px;
    border: 0.5px solid #f4c0d1;
    border-radius: 8px; padding: 0 10px;
    font-family: inherit; font-size: 13px;
    color: #2c2c2a;
    background: #fff5f8;
    outline: none; transition: border-color 0.15s;
    -webkit-appearance: none;
    appearance: none;
  }

  .mc-field input:focus,
  .mc-field select:focus {
    border-color: #d4537e;
    background: #fff;
  }

  .shop-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .shop-set-title {
    font-size: 13px; font-weight: 600;
    color: #993556; margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 0.5px solid #f4c0d1;
  }

  .item-row {
    display: flex; align-items: center;
    gap: 7px; padding: 4px 0; cursor: pointer;
  }

  .item-row input[type=checkbox] {
    accent-color: #d4537e;
    width: 14px; height: 14px;
    cursor: pointer; flex-shrink: 0;
  }

  .item-label { font-size: 13px; color: #2c2c2a; flex: 1; }

  .item-cost {
    font-size: 11px; color: #d4537e;
    background: #fbeaf0; border: 0.5px solid #f4c0d1;
    border-radius: 6px; padding: 1px 6px;
    font-weight: 500; white-space: nowrap;
  }

  .toggle-btns { display: flex; gap: 6px; margin-top: 8px; }

  .toggle-btn {
    font-size: 11px; font-family: inherit;
    color: #993556; background: transparent;
    border: 0.5px solid #ed93b1; border-radius: 6px;
    padding: 3px 10px; cursor: pointer; transition: background 0.12s;
  }

  .toggle-btn:hover { background: #fbeaf0; }

  .calc-btn {
    display: block; width: 100%; height: 42px;
    background: #d4537e; color: #fff; border: none;
    border-radius: 10px; font-family: inherit;
    font-size: 15px; font-weight: 600;
    letter-spacing: 0.05em; cursor: pointer;
    margin-top: 1rem; transition: background 0.15s, transform 0.1s;
  }

  .calc-btn:hover { background: #c4406d; }
  .calc-btn:active { transform: scale(0.98); background: #b33362; }

  .result-area { margin-top: 1rem; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px; margin-bottom: 12px;
  }

  .stat-card {
    background: #fbeaf0; border: 0.5px solid #f4c0d1;
    border-radius: 10px; padding: 10px 8px; text-align: center;
  }

  .stat-label { font-size: 11px; color: #993556; margin-bottom: 4px; }
  .stat-value { font-size: 18px; font-weight: 600; color: #72243e; }

  .result-msg {
    border-radius: 10px; padding: 12px 16px;
    text-align: center; font-size: 14px; font-weight: 500;
  }

  .result-msg.ok { background: #eaf3de; border: 0.5px solid #c0dd97; color: #3b6d11; }
  .result-msg.shortage { background: #fbeaf0; border: 0.5px solid #f4c0d1; color: #72243e; }

  .rose-divider {
    text-align: center; font-size: 13px;
    color: #ed93b1; margin: 6px 0 10px; letter-spacing: 0.2em;
  }

  @media (max-width: 500px) {
    body { background: #fff5f8; }
    .mc-wrap { padding: 1.25rem 0.9rem 2rem; }
    .mc-logo-ring { width: 48px; height: 48px; font-size: 22px; }
    .mc-title { font-size: 18px; }
    .mc-card { padding: 1rem; }
    .mc-form-grid { grid-template-columns: 1fr; gap: 10px; }
    .mc-field input, .mc-field select { height: 40px; font-size: 15px; border-radius: 10px; }
    .mc-field label { font-size: 13px; }
    .shop-grid { grid-template-columns: 1fr; gap: 16px; }
    .item-row { padding: 6px 0; }
    .item-row input[type=checkbox] { width: 16px; height: 16px; }
    .item-label { font-size: 14px; }
    .item-cost { font-size: 12px; padding: 2px 8px; }
    .toggle-btn { font-size: 12px; padding: 5px 14px; }
    .calc-btn { height: 48px; font-size: 16px; border-radius: 12px; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat-label { font-size: 12px; }
    .stat-value { font-size: 20px; }
    .result-msg { font-size: 15px; padding: 14px 16px; }
  }
</style>
</head>
<body>

<div class="mc-wrap">
  <div class="mc-header">
    <div class="mc-logo-ring">🌹</div>
    <div class="mc-title">魔法對決貨幣計算器</div>
    <div class="mc-subtitle">第一賽季・玫瑰的信期</div>
    <div class="mc-meta">3/12 – 7/3　製作者 @yzhtaotao</div>
  </div>

  <div class="mc-card">
    <div class="mc-section-title">基本設定</div>
    <div class="mc-form-grid">
      <div class="mc-field">
        <label>日期</label>
        <input type="date" id="today">
      </div>
      <div class="mc-field">
        <label>每日額外次數</label>
        <input type="number" id="extra" value="0" min="0">
      </div>
      <div class="mc-field">
        <label>目前已有貨幣</label>
        <input type="number" id="current" value="0" min="0">
      </div>
      <div class="mc-field">
        <label>段位</label>
        <select id="rank">
          <option value="500">魔法傳奇 第1名</option>
          <option value="480">魔法傳奇 第2名</option>
          <option value="450">魔法傳奇 第3名</option>
          <option value="400">魔法傳奇 前50名</option>
          <option value="350">魔法傳奇 前100名</option>
          <option value="300">魔法傳奇 前200名</option>
          <option value="260">大魔導師 3段</option>
          <option value="230">大魔導師 2段</option>
          <option value="200">大魔導師 1段</option>
          <option value="175">魔導師 3段</option>
          <option value="150">魔導師 2段</option>
          <option value="125">魔導師 1段</option>
          <option value="100">祕法師 3段</option>
          <option value="80">祕法師 2段</option>
          <option value="60">祕法師 1段</option>
          <option value="40">魔法師 3段</option>
          <option value="30">魔法師 2段</option>
          <option value="20">魔法師 1段</option>
        </select>
      </div>
    </div>
  </div>

  <div class="mc-card">
    <div class="mc-section-title">商店兌換</div>
    <div class="shop-grid">
      <div>
        <div class="shop-set-title">落花晚禮服</div>
        <div id="set1"></div>
        <div class="toggle-btns">
          <button class="toggle-btn" onclick="toggleSet('set1',true)">全選</button>
          <button class="toggle-btn" onclick="toggleSet('set1',false)">取消</button>
        </div>
      </div>
      <div>
        <div class="shop-set-title">馥雅芬芳</div>
        <div id="set2"></div>
        <div class="toggle-btns">
          <button class="toggle-btn" onclick="toggleSet('set2',true)">全選</button>
          <button class="toggle-btn" onclick="toggleSet('set2',false)">取消</button>
        </div>
      </div>
    </div>
  </div>

  <button class="calc-btn" onclick="calc()">✦ 計算貨幣 ✦</button>
  <div id="result" class="result-area"></div>
</div>

<script>
document.getElementById("today").value = new Date().toISOString().split("T")[0];

const end = new Date("2026-07-03");

const set1 = [
  ["煙粉花瓣",1280],["煙粉晚禮服",1580],["淺粉挽紗",880],
  ["花瓣高跟",980],["落花",780],["柔白珍珠",780],
  ["粉紅寶石",740],["粉花",740],["花色",740]
];
const set2 = [
  ["輕盈嫻雅",580],["紫韻優雅",680],["米白連褲襪",420],
  ["紫韻小花",460],["紫韻飛花",360],["紫韻花蕊",320],
  ["紫色絨花",360],["馥雅",320]
];

function renderSet(set, id) {
  const div = document.getElementById(id);
  set.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <input type="checkbox" data-cost="${item[1]}" id="${id}_${item[0]}">
      <label class="item-label" for="${id}_${item[0]}">${item[0]}</label>
      <span class="item-cost">${item[1].toLocaleString()}</span>
    `;
    div.appendChild(row);
  });
}

renderSet(set1, "set1");
renderSet(set2, "set2");

function toggleSet(id, state) {
  document.querySelectorAll(`#${id} input`).forEach(cb => cb.checked = state);
}

function countWeeks(start, end) {
  let count = 0;
  let d = new Date(start);
  while (d <= end) {
    if (d.getDay() === 0) { count++; d.setDate(d.getDate() + 7); }
    else d.setDate(d.getDate() + 1);
  }
  return count;
}

function calc() {
  const today = new Date(document.getElementById("today").value);
  const weekly = Number(document.getElementById("rank").value);
  const current = Number(document.getElementById("current").value);
  const extra = Number(document.getElementById("extra").value);
  const days = Math.floor((end - today) / (1000 * 60 * 60 * 24));
  const resultDiv = document.getElementById("result");

  if (!document.getElementById("today").value || days <= 0) {
    resultDiv.innerHTML = '<div class="result-msg shortage">賽季已結束或日期未填寫</div>';
    return;
  }

  let need = 0;
  document.querySelectorAll("input[type=checkbox]:checked").forEach(cb => need += Number(cb.dataset.cost));

  const daily = (5 + extra) * 5;
  const weeks = countWeeks(today, end);
  const total = Math.floor(current + daily * days + weeks * weekly);
  const gap = need - total;
  const needExtraPerDay = gap > 0 ? Math.ceil((gap / 5) / days) : 0;

  resultDiv.innerHTML = `
    <div class="rose-divider">— ✦ —</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">剩餘天數</div><div class="stat-value">${days}</div></div>
      <div class="stat-card"><div class="stat-label">結算次數</div><div class="stat-value">${weeks}</div></div>
      <div class="stat-card"><div class="stat-label">需求貨幣</div><div class="stat-value">${need.toLocaleString()}</div></div>
      <div class="stat-card"><div class="stat-label">共可獲得</div><div class="stat-value">${total.toLocaleString()}</div></div>
    </div>
    ${gap > 0
      ? `<div class="result-msg shortage">還差 <strong>${Math.ceil(gap).toLocaleString()}</strong> 貨幣，每日需額外購買 <strong>${needExtraPerDay}</strong> 次</div>`
      : `<div class="result-msg ok">✓ 貨幣足夠，可兌換所有已勾選目標！</div>`
    }
  `;
}
</script>
</body>
</html>
